name: Discussion bot
on:
  discussion:
    types: [created, edited, deleted, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      init_only:
        description: Only initialize summary and context discussions
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  curate:
    # Configuring the App enables this job; there is no personal-token fallback.
    if: ${{ vars.BOT_APP_CLIENT_ID != '' && github.event.sender.type != 'Bot' }}
    concurrency:
      group: discussion-bot
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-discussions: write
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Replace REPLACE_WITH_COMMIT_SHA with the published personal repository commit.
      - uses: Anitier2005/github-discussion-bot@REPLACE_WITH_COMMIT_SHA
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_APP_LOGIN: ${{ steps.app-token.outputs.app-slug }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '300' }}
          BOT_BLACKLIST: ${{ vars.BOT_BLACKLIST || '{}' }}
          BOT_MEDIA_HOSTS: ${{ vars.BOT_MEDIA_HOSTS }}
          BOT_SYSTEM_PROMPT: ${{ vars.BOT_SYSTEM_PROMPT }}
          BOT_CATEGORY: ${{ vars.BOT_CATEGORY }}
          BOT_RULES_PATH: .github/discussion-bot/rules.md
          BOT_INIT_ONLY: ${{ inputs.init_only && 'true' || 'false' }}
